<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>푸바오가 늑구를 찾아 부캉이를 타고 돌아오게 하는 게임</title>
  <style>
    body { margin: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
    canvas { background: #1e293b; border: 4px solid #334155; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .info { margin-bottom: 10px; font-size: 20px; font-weight: bold; }
    #restartBtn { display: none; margin-top: 15px; padding: 10px 30px; font-size: 18px; font-weight: bold; background: #059669; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #restartBtn:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="info" id="gameInfo">점수: 0 | 푸바오야 늑구를 찾아줭</div>
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <button id="restartBtn" onclick="resetGame()">다시하기</button>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restartBtn");

    let score = 0;
    let stage = 1;
    let isGameOver = false;
    let isWin = false;

    // 이미지 객체 로드
    const imgFubaoRun = new Image(); imgFubaoRun.src = "fubao_run.png";
    const imgNeukguRun = new Image(); imgNeukguRun.src = "neukgu_run.png";
    const imgBukangRun = new Image(); imgBukangRun.src = "bukang_run.png";
    const imgHug = new Image(); imgHug.src = "fubao_hug_neukgu.png";
    const imgBukangRide = new Image(); imgBukangRide.src = "fubao_neukgu_bukang.png";
    const imgZookeeper = new Image(); imgZookeeper.src = "zookeeper.png";
    const imgObstacle = new Image(); imgObstacle.src = "obstacle.png";

    // 플레이어 객체 (크기 1.5배 증가: 70x70, 바닥 높이 280)
    let player = { x: 80, y: 280, w: 70, h: 70, vy: 0, jumpPower: -11.5, grounded: true };
    
    // NPC 객체 (크기 증가에 맞춰 간격 조정)
    let npc = { y: 280, vy: 0, jumpPower: -10.5, grounded: true, xOffset: 160, targetOffset: 160 };

    let obstacles = [];
    let coins = [];

    // 점프 조작
    window.addEventListener("keydown", e => {
      if ((e.code === "Space" || e.code === "ArrowUp") && player.grounded && !isGameOver && !isWin) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }
    });

    // 1초마다 점수 증가 및 단계 체크
    setInterval(() => {
      if (!isGameOver && !isWin) {
        score += 1;
        if (score >= 1000) {
          isWin = true; 
          restartBtn.style.display = "block";
        }
        else if (score >= 500) {
          stage = 3;
          npc.targetOffset = -100; // 커진 사육사는 조금 더 뒤에서 쫓아옴
        }
        else if (score >= 100) {
          stage = 2;
          npc.targetOffset = 180; // 부캉이는 넉넉히 앞에서 도망침
        }
      }
    }, 1000);

    function resetGame() {
      score = 0;
      stage = 1;
      isGameOver = false;
      isWin = false;
      player.y = 280;
      player.vy = 0;
      player.grounded = true;
      npc.y = 280;
      npc.vy = 0;
      npc.targetOffset = 160;
      obstacles = [];
      coins = [];
      restartBtn.style.display = "none";
    }

    function spawnObjects() {
      // 장애물 생성 (크기가 60x60으로 커졌으므로 최소 거리 350 보장)
      let lastObs = obstacles.length > 0 ? obstacles[obstacles.length - 1] : null;
      let minGap = 350; 

      if (!lastObs || (canvas.width - lastObs.x > minGap)) {
        if (Math.random() < 0.015) {
          // 크기 증가된 장애물
          obstacles.push({ x: canvas.width, y: 290, w: 60, h: 60, speed: stage === 3 ? 6.5 : 5.5 });
        }
      }

      // 코인 생성 (크기 증가 40x40, 먹을 수 있는 높이로 조절)
      if (Math.random() < 0.01) {
        coins.push({ x: canvas.width, y: Math.random() * 50 + 170, w: 40, h: 40, speed: 5.5 });
      }
    }

    function update() {
      if (isGameOver || isWin) return;

      // 1. 플레이어 물리 연산
      player.vy += 0.55;
      player.y += player.vy;
      if (player.y > 280) { // 바닥 기준점 280
        player.y = 280;
        player.vy = 0;
        player.grounded = true;
      }

      // 2. 상대방(NPC) 물리 연산
      npc.vy += 0.55;
      npc.y += npc.vy;
      if (npc.y > 280) { // 바닥 기준점 280
        npc.y = 280;
        npc.vy = 0;
        npc.grounded = true;
      }

      // NPC 자동 점프 (생동감)
      if (npc.grounded && Math.random() < 0.008) {
        npc.vy = npc.jumpPower;
        npc.grounded = false;
      }
      
      // 앞뒤로 멀어졌다 가까워지는 움직임
      npc.xOffset = npc.targetOffset + Math.sin(Date.now() / 300) * 35;

      spawnObjects();

      // 3. 장애물 이동 및 충돌 체크
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= obs.speed;

        // 히트박스 충돌 판정 (살짝 여유를 둬서 억울하게 안 죽게 설정)
        let hitMargin = 10;
        if (player.x + hitMargin < obs.x + obs.w && player.x + player.w - hitMargin > obs.x && player.y + hitMargin < obs.y + obs.h && player.y + player.h - hitMargin > obs.y) {
          isGameOver = true;
          restartBtn.style.display = "block";
        }
        if (obs.x < -100) obstacles.splice(i, 1);
      }

      // 4. 코인 이동 및 획득 (+5점)
      for (let i = coins.length - 1; i >= 0; i--) {
        let coin = coins[i];
        coin.x -= coin.speed;

        if (player.x < coin.x + coin.w && player.x + player.w > coin.x && player.y < coin.y + coin.h && player.y + player.h > coin.y) {
          score += 5;
          coins.splice(i, 1);
        }
        if (coin.x < -100) coins.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 바닥 렌더링
      ctx.fillStyle = "#334155";
      ctx.fillRect(0, 350, canvas.width, 50);

      // 캐릭터 단계별 연출 (커진 크기에 맞춰 좌표 및 사이즈 조절)
      let currentNpcX = player.x + npc.xOffset;

      if (stage === 1) {
        // 1단계: 늑구 60x60, 푸바오 70x70
        ctx.drawImage(imgNeukguRun, currentNpcX, npc.y + 10, 60, 60);
        ctx.drawImage(imgFubaoRun, player.x, player.y, player.w, player.h);
      } 
      else if (stage === 2) {
        // 2단계: 부캉이 90x50, 늑구 안은 푸바오 80x70
        ctx.drawImage(imgBukangRun, currentNpcX, npc.y + 20, 90, 50);
        ctx.drawImage(imgHug, player.x, player.y, 80, 70);
      } 
      else if (stage === 3) {
        // 3단계: 부캉이 탑승 100x80, 사육사 70x80
        ctx.drawImage(imgBukangRide, player.x, player.y - 10, 100, 80);
        ctx.drawImage(imgZookeeper, currentNpcX, npc.y - 10, 70, 80);
      }

      // 장애물 렌더링 (60x60)
      obstacles.forEach(obs => {
        if (imgObstacle.complete && imgObstacle.naturalWidth !== 0) {
          ctx.drawImage(imgObstacle, obs.x, obs.y, obs.w, obs.h);
        } else {
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        }
      });

      // 코인 렌더링 (반경 커짐)
      ctx.fillStyle = "#eab308";
      coins.forEach(coin => {
        ctx.beginPath();
        ctx.arc(coin.x + coin.w/2, coin.y + coin.h/2, coin.w/2, 0, Math.PI * 2);
        ctx.fill();
      });

      // 상단 점수 및 단계 제목 표시
      let stageText = "푸바오야 늑구를 찾아줭";
      if (stage === 2) stageText = "늑구를 안은 푸바오의 부캉이 얻기 대작전";
      if (stage === 3) stageText = "늑구를 안고 부캉이를 탄 푸바오의 자유 되찾기 대작전";
      document.getElementById("gameInfo").textContent = "점수: " + score + " | " + stageText;

      // 게임 결과 화면
      if (isGameOver || isWin) {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.textAlign = "center";
        
        if (isGameOver) {
          ctx.fillStyle = "#ef4444";
          ctx.font = "bold 40px sans-serif";
          ctx.fillText("실패", canvas.width/2, canvas.height/2 + 10);
        } else if (isWin) {
          ctx.fillStyle = "#3b82f6";
          ctx.font = "bold 30px sans-serif";
          ctx.fillText("바다로 탈출했지만 어부에게 잡혔다... (실패)", canvas.width/2, canvas.height/2 + 10);
        }
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
