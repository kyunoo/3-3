<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시간표</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f4f6f9;
      color: #333;
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header { position: relative; text-align: center; margin-bottom: 25px; z-index: 1; }
    .current-time { position: absolute; left: 0; top: 0; font-size: 26px; font-weight: 800; color: #1e293b; background: #ffffff; padding: 10px 20px; border-radius: 20px; border: 2px solid #cbd5e1; box-shadow: 0 3px 6px rgba(0,0,0,0.08); user-select: none; }
    .title-row { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 10px; margin-top: 10px; }
    h1 { color: #1a365d; margin: 0; }
    .header-notice-container { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-end; }
    .header-notice-btn { padding: 12px 26px; background: #059669; color: #ffffff; border: none; border-radius: 28px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(5, 150, 105, 0.35); }
    .notice-sub-comment { font-size: 14px; color: #475569; margin-top: 6px; font-weight: 700; }
    .class-select-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .class-select-box select { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: bold; font-size: 15px; color: #1e293b; background: white; }
    .top-grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; position: relative; z-index: 1; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; position: relative; z-index: 1; }
    .card h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .com-link-btn, .class-notice-setup-btn, .edit-schedule-btn { font-size: 13px; font-weight: bold; color: #ffffff; border: none; border-radius: 16px; padding: 6px 14px; cursor: pointer; }
    .com-link-btn { background-color: #2563eb; text-decoration: none; }
    .class-notice-setup-btn { background-color: #d97706; }
    .edit-schedule-btn { background-color: #059669; }
    .meal-date-title { text-align: center; margin-bottom: 10px; }
    .date-click { font-size: 15px; color: #059669; cursor: pointer; text-decoration: underline; font-weight: bold; }
    .meal-content-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 150px; }
    .meal-circle-btn { width: 38px; height: 38px; border-radius: 50%; background-color: #059669; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .meal-content { flex: 1; line-height: 1.8; white-space: pre-line; font-size: 18px; font-weight: 600; text-align: center; color: #1e293b; }
    .calorie-info { font-size: 14px; color: #059669; font-weight: bold; margin-top: 4px; text-align: center; }
    .dday-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 5px; }
    .dday-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px 10px; text-align: center; }
    .dday-title { font-size: 13px; color: #64748b; font-weight: bold; margin-bottom: 4px; }
    .dday-count { font-size: 20px; font-weight: 800; color: #1e293b; }
    .dday-count.today { color: #dc2626; }
    .dday-date { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .schedule-item { display: flex; padding: 8px 10px; background-color: #f8fafc; border-radius: 6px; border-left: 4px solid #059669; margin-bottom: 8px; }
    .period { font-weight: bold; width: 60px; color: #059669; }
    .subject { font-weight: 500; }
    .day-selector { display: flex; gap: 5px; margin-bottom: 15px; }
    .day-btn { flex: 1; padding: 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; }
    .day-btn.active { background: #059669; color: white; border-color: #059669; font-weight: bold; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; }
    .close-btn { font-size: 24px; cursor: pointer; border: none; background: none; color: #64748b; }
    .tool-controls-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    .tool-controls-group input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .btn-primary { background: #059669; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; margin-top: 8px; }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    .footer-btn { padding: 8px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 20px; color: #334155; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div id="clockDisplay" class="current-time">00:00:00</div>
    <div class="title-row">
      <h1>대전하기중학교</h1>
      <div class="header-notice-container">
        <button class="header-notice-btn" onclick="openNoticeModal()">사용방법</button>
        <div class="notice-sub-comment">지가 안읽어놓고 불편하다며 떼쓰기는 ㄴㄴ</div>
      </div>
    </div>
    <div class="class-select-box">
      <select id="gradeSelect" onchange="changeClass()">
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3" selected>3학년</option>
      </select>
      <select id="classSelect" onchange="changeClass()">
        <option value="1">1반</option>
        <option value="2">2반</option>
        <option value="3" selected>3반</option>
        <option value="4">4반</option>
        <option value="5">5반</option>
        <option value="6">6반</option>
      </select>
    </div>
  </header>

  <div class="top-grid-container">
    <div class="card">
      <h2>
        <span>시간표 <span id="selectedDayText" style="font-size: 14px; color: #64748b;"></span></span>
      </h2>
      <div class="day-selector">
        <button class="day-btn" onclick="selectDay(1)">월</button>
        <button class="day-btn" onclick="selectDay(2)">화</button>
        <button class="day-btn" onclick="selectDay(3)">수</button>
        <button class="day-btn" onclick="selectDay(4)">목</button>
        <button class="day-btn" onclick="selectDay(5)">금</button>
      </div>
      <div id="viewScheduleArea" class="schedule-list"></div>
    </div>

    <div class="card">
      <h2><span>급식</span></h2>
      <div class="meal-date-title">
        <span class="date-click" id="mealDateBtn">날짜 불러오는 중...</span>
      </div>
      <div class="meal-content-row">
        <button class="meal-circle-btn" onclick="changeMealDate(-1)">&lt;</button>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
          <div id="mealResult" class="meal-content">급식을 불러오는 중...</div>
          <div id="calorieResult" class="calorie-info"></div>
        </div>
        <button class="meal-circle-btn" onclick="changeMealDate(1)">&gt;</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2><span>주요 학사일정 D-Day</span></h2>
    <div id="ddayContainer" class="dday-grid"></div>
  </div>

  <!-- 제비뽑기 모달 (이스터에그 트리거 포함) -->
  <div id="lotteryModal" class="modal" onclick="closeModalOnBg(event, 'lotteryModal')">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3 style="margin:0; color: #1e293b;">번호 제비뽑기</h3>
        <button class="close-btn" onclick="closeLotteryModal()">&times;</button>
      </div>
      <div class="tool-controls-group">
        <label style="font-weight: bold; color: #475569;">전체 인원수:</label>
        <input type="number" id="lotteryCount" value="35" style="width: 100px;">
        <button class="btn-primary" style="width: auto; margin-top:0;" onclick="runLottery()">추첨하기</button>
      </div>
      <div id="lotteryResult" style="font-size: 18px; font-weight: bold; color: #dc2626; text-align: center; margin-top: 15px;"></div>
    </div>
  </div>

  <footer>
    <div>제작자: 박현우</div>
    <div>
      <button class="footer-btn" onclick="openLotteryModal()">제비뽑기</button>
    </div>
  </footer>

  <script>
    const API_KEY = "7ded97c5c139416b80d2d044458bfed5";
    const ATPT_CODE = "G10";
    const SCHOOL_CODE = "7451051"; 

    const today = new Date();
    let currentMealDate = new Date();
    let currentDay = today.getDay();
    if (currentDay === 0 || currentDay === 6) currentDay = 1;

    const maxPeriods = { 1: 6, 2: 7, 3: 7, 4: 6, 5: 6 };
    const dayNames = ["", "월요일", "화요일", "수요일", "목요일", "금요일"];

    const defaultSchedules = {
      3: {
        3: {
          1: ["영회", "과학1", "국어1", "수학", "도덕", "사회"],
          2: ["기가", "체육", "과학1", "도덕", "스포", "영어A", "음악"],
          3: ["사회", "미술", "미술", "국어2", "기가", "영어A", ""],
          4: ["국어1", "수학", "영어A", "국어2", "체육", "역사"],
          5: ["체육", "진직", "과학1", "수학", "과학2", "역사"]
        }
      }
    };

    window.onload = function() {
      updateClock();
      setInterval(updateClock, 1000);
      fetchMealByDate(currentMealDate);
      selectDay(currentDay);
    };

    function updateClock() {
      const now = new Date();
      document.getElementById("clockDisplay").textContent = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0') + ":" + String(now.getSeconds()).padStart(2, '0');
    }

    function selectDay(dayNum) {
      currentDay = dayNum;
      document.getElementById("selectedDayText").textContent = "(" + dayNames[dayNum] + ")";
      const buttons = document.querySelectorAll(".day-btn");
      buttons.forEach((btn, idx) => {
        if (idx + 1 === dayNum) btn.classList.add("active");
        else btn.classList.remove("active");
      });
      renderScheduleView();
    }

    function renderScheduleView() {
      const viewDiv = document.getElementById("viewScheduleArea");
      const count = maxPeriods[currentDay];
      let html = "";
      for (let i = 0; i < count; i++) {
        html += '<div class="schedule-item"><span class="period">' + (i + 1) + '교시</span><span class="subject">과목명</span></div>';
      }
      viewDiv.innerHTML = html;
    }

    function fetchMealByDate(targetDate) {
      const mealDiv = document.getElementById("mealResult");
      const calDiv = document.getElementById("calorieResult");
      const dateBtn = document.getElementById("mealDateBtn");

      const year = targetDate.getFullYear();
      const month = String(targetDate.getMonth() + 1).padStart(2, '0');
      const day = String(targetDate.getDate()).padStart(2, '0');
      dateBtn.textContent = year + "." + month + "." + day;
      mealDiv.textContent = "급식 정보 로딩 중...";

      const url = "https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=" + API_KEY + "&Type=json&ATPT_OFCDC_SC_CODE=" + ATPT_CODE + "&SD_SCHUL_CODE=" + SCHOOL_CODE + "&MLSV_YMD=" + (year + month + day);

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data && data.mealServiceDietInfo) {
            const row = data.mealServiceDietInfo[1].row[0];
            mealDiv.textContent = (row.DDISH_NM || "").replace(/<br\/>/g, '\n').replace(/\([0-9.]+\)/g, '');
            calDiv.textContent = row.CAL_INFO ? "열량: " + row.CAL_INFO : "";
          } else {
            mealDiv.textContent = "해당 날짜의 급식 정보가 없습니다.";
            calDiv.textContent = "";
          }
        }).catch(() => {
          mealDiv.textContent = "급식 정보를 불러오지 못했습니다.";
        });
    }

    function changeMealDate(offset) {
      currentMealDate.setDate(currentMealDate.getDate() + offset);
      fetchMealByDate(currentMealDate);
    }

    function openLotteryModal() { document.getElementById("lotteryModal").style.display = "flex"; }
    function closeLotteryModal() { document.getElementById("lotteryModal").style.display = "none"; }
    function closeModalOnBg(e, modalId) { if (e.target.id === modalId) document.getElementById(modalId).style.display = "none"; }

    function runLottery() {
      const countVal = document.getElementById("lotteryCount").value.trim();
      const grade = document.getElementById("gradeSelect").value;
      const cls = document.getElementById("classSelect").value;

      // [이스터에그] 3학년 3반 + 인원수 75199521 입력 시 미니게임 발동!
      if (grade === "3" && cls === "3" && countVal === "75199521") {
        alert("🚨 비밀 미니게임 발동! 푸바오의 북항 대탈출을 시작합니다!");
        window.location.href = "game.html";
        return;
      }

      const total = parseInt(countVal);
      if (!total || total < 1) {
        alert("올바른 인원수를 입력하세요.");
        return;
      }
      const selected = Math.floor(Math.random() * total) + 1;
      document.getElementById("lotteryResult").textContent = "당첨: " + selected + "번!";
    }
  </script>
</body>
</html>
