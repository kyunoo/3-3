<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시간표 & 급식 정보</title>
  <style>
    /* 1. 흰색 배경 & 기본 설정 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
      color: #111111;
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* 2. 둥글둥글 사각형 & 연갈색 배경 / 갈색 테두리 */
    .card {
      background-color: #f7e7d3; /* 연갈색 */
      border: 2px solid #8b5a2b; /* 갈색 테두리 */
      border-radius: 18px; /* 둥글둥글 사각형 */
      padding: 20px;
      box-shadow: 0 4px 10px rgba(139, 90, 43, 0.1);
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    header {
      position: relative;
      text-align: center;
      margin-bottom: 25px;
      z-index: 1;
    }

    /* 조건 2. 좌측 상단 작은 현재 시간 표시 */
    .current-time {
      position: absolute;
      left: 0;
      top: 0;
      font-size: 16px;
      font-weight: bold;
      color: #3d2314;
      background: #f0d5b7;
      border: 2px solid #8b5a2b;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }
    .current-time:hover {
      transform: scale(1.05);
    }

    /* 조건 2. 전체 화면 꽉 채우는 시계 모달 (세로 90% 크기 매우 연한 반투명 회색) */
    .clock-fullscreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.95);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .clock-fullscreen-text {
      font-size: 25vw; /* 화면 비율에 맞춘 거대한 세로형 크기 */
      font-weight: 900;
      color: rgba(0, 0, 0, 0.08); /* 두껍고 매우 연한 반투명 회색 */
      writing-mode: vertical-rl; /* 세로로 긴 글씨 */
      text-orientation: upright;
      letter-spacing: -1vw;
      line-height: 1;
      height: 90vh; /* 세로 90% 채움 */
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* 조건 4. 맨 위 가운데 D-Day 큰 글씨 및 레이아웃 */
    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }
    .main-dday {
      font-size: 28px;
      font-weight: 900;
      color: #3d2314;
    }
    .main-dday-sub {
      font-size: 16px;
      color: #8b5a2b;
      margin-left: 8px;
      font-weight: bold;
    }

    /* 조건 5. 세로로 작은 전체 D-day 목록 */
    .dday-list-small {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: #5c3a1e;
      background: rgba(255, 255, 255, 0.5);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid #d4b28c;
    }

    .class-select-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
    }
    .class-select-box select {
      padding: 8px 14px;
      border-radius: 10px;
      border: 2px solid #8b5a2b;
      font-weight: bold;
      font-size: 15px;
      color: #3d2314;
      background: #ffffff;
      cursor: pointer;
    }

    /* 조건 1. 16:9 스크린 기준 양옆 배치 (왼쪽: 시간표 / 오른쪽: 급식정보) */
    .top-grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 768px) {
      .top-grid-container {
        grid-template-columns: 1fr;
      }
      .current-time {
        position: static;
        display: inline-block;
        margin-bottom: 10px;
      }
    }

    .card h2 {
      margin-top: 0;
      color: #3d2314;
      border-bottom: 2px solid #8b5a2b;
      padding-bottom: 10px;
      font-size: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 시간표 요소 */
    .day-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
    }
    .day-btn {
      flex: 1;
      padding: 8px;
      border: 1.5px solid #8b5a2b;
      background: #ffffff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #3d2314;
    }
    .day-btn.active {
      background: #8b5a2b;
      color: #ffffff;
    }

    .schedule-item {
      display: flex;
      padding: 10px 12px;
      background-color: #ffffff;
      border-radius: 8px;
      border-left: 5px solid #8b5a2b;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .period {
      font-weight: bold;
      width: 70px;
      color: #8b5a2b;
    }
    .subject {
      font-weight: 600;
      color: #111111;
    }

    /* 급식 영역 관련 */
    .meal-date-title {
      text-align: center;
      margin-bottom: 10px;
    }
    .date-click {
      font-size: 16px;
      color: #8b5a2b;
      cursor: pointer;
      text-decoration: underline;
      font-weight: bold;
    }
    .meal-content-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 180px;
    }
    .meal-circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #8b5a2b;
      color: white;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
    }
    .meal-circle-btn:hover {
      background-color: #6a421f;
    }

    .meal-content {
      flex: 1;
      line-height: 1.8;
      white-space: pre-line;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      padding: 8px 0;
      color: #111111;
    }
    .calorie-info {
      font-size: 14px;
      color: #8b5a2b;
      font-weight: bold;
      margin-top: 4px;
      text-align: center;
    }

    .meal-footer {
      text-align: right;
      margin-top: 15px;
    }
    .today-reset-btn {
      background: #8b5a2b;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    /* 모달 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid #8b5a2b;
    }
    .close-btn {
      font-size: 24px;
      cursor: pointer;
      border: none;
      background: none;
      color: #8b5a2b;
    }
    .monthly-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .day-meal-box {
      background: #f7e7d3;
      border: 1px solid #8b5a2b;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
    }

    /* 푸터 */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid #e8c6a0;
      position: relative;
      z-index: 1;
    }
    .footer-credits {
      font-size: 14px;
      font-weight: 600;
      color: #5c3a1e;
    }
    .admin-bottom-btn {
      padding: 8px 16px;
      background: #ffffff;
      border: 2px solid #8b5a2b;
      border-radius: 20px;
      color: #3d2314;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 조건 2. 전체 화면 확대 시계 (클릭 시 종료) -->
  <div id="clockModal" class="clock-fullscreen" onclick="toggleClockFullscreen()">

      <div id="allDdayList" class="dday-list-small"></div>

          <option value="3" selected>3반</option>

          <option value="5">5반</option>
          <option value="6">6반</option>
        </select>
      </div>
    </div>
  </header>

  <!-- 조건 1. 16:9 가로 스크린 기준 양 옆 배치 (시간표 왼쪽 / 급식정보 오른쪽) -->
  <div class="top-grid-container">
    <!-- 왼쪽: 시간표 카드 -->
    <div class="card">
      <h2>
        <span>시간표 <span id="selectedDayText" style="font-size: 14px; color: #8b5a2b;"></span></span>
      </h2>

      <div class="day-selector">
        <button class="day-btn" onclick="selectDay(1)">월</button>
        <button class="day-btn" onclick="selectDay(2)">화</button>
        <button class="day-btn" onclick="selectDay(3)">수</button>

      <div id="editScheduleArea" style="display: none; background: #ffffff; padding: 15px; border-radius: 10px; border: 2px dashed #8b5a2b; margin-top: 10px;">
        <div style="font-weight: bold; color: #3d2314; margin-bottom: 10px; font-size: 15px;">과목명 수정하기</div>
        <div id="inputForm"></div>
        <button class="admin-bottom-btn" style="width: 100%; margin-top: 10px;" onclick="saveSchedule()">수정사항 저장하기</button>
      </div>
    </div>

    <!-- 오른쪽: 급식 정보 카드 -->
    <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <h2><span>급식 정보</span></h2>
        
        <div class="meal-date-title">
          <span class="date-click" onclick="openMealModal()" id="mealDateBtn">날짜 불러오는 중...</span>
        </div>

        <div class="meal-content-row">
          <button class="meal-circle-btn" onclick="changeMealDate(-1)">&lt;</button>
          
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <div id="mealResult" class="meal-content">급식을 불러오는 중...</div>

      <div class="meal-footer">

  <!-- 번호 제비뽑기 -->

  <script>
    const API_KEY = "7ded97c5c139416b80d2d044458bfed5";
    const ATPT_CODE = "G10";
    const SCHOOL_CODE = "7451051"; 

    const today = new Date();
    let currentMealDate = new Date();

    let currentDay = today.getDay();
    if (currentDay === 0 || currentDay === 6) currentDay = 1;

    const maxPeriods = { 1: 6, 2: 7, 3: 7, 4: 6, 5: 6 };
    const dayNames = ["", "월요일", "화요일", "수요일", "목요일", "금요일"];

    // 시계 업데이트 기능
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const timeStr = `${hours}:${minutes}:${seconds}`;
      
      document.getElementById("clockDisplay").textContent = timeStr;
      document.getElementById("clockFullscreenText").textContent = timeStr;
    }

    // 조건 2. 시계 풀스크린 토글
    function toggleClockFullscreen() {
      const modal = document.getElementById("clockModal");
      if (modal.style.display === "flex") {
        modal.style.display = "none";
      } else {
        modal.style.display = "flex";
      }
    }

    // 조건 4 & 5. D-Day 처리 (가장 가까운 D-Day 상단 표기 & 전체 세로 목록 표기)
    const events = [
      { name: "중간고사", date: "2026-09-22" },
      { name: "체육대회", date: "2026-10-08" },
      { name: "3학년 기말고사", date: "2026-11-16" },
      { name: "1,2학년 기말고사", date: "2026-12-14" },
      { name: "솔마루 축제", date: "2026-12-24" },
      { name: "종업식 / 졸업식", date: "2027-01-05" },
      { name: "겨울방학", date: "2027-01-06" }
    ];

    function renderDday() {
      const nearestDiv = document.getElementById("nearestDday");
      const listDiv = document.getElementById("allDdayList");
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      let upcomingEvents = [];

      events.forEach(evt => {
        const targetDate = new Date(evt.date);
        const diffDays = Math.floor((targetDate - todayDate) / (1000 * 60 * 60 * 24));
        if (diffDays >= 0) {
          upcomingEvents.push({ ...evt, diffDays });
        }
      });

      if (upcomingEvents.length > 0) {
        // 일정이 가까운 순으로 정렬
        upcomingEvents.sort((a, b) => a.diffDays - b.diffDays);

        // 가장 가까운 디데이 1개
        const first = upcomingEvents[0];
        const firstText = first.diffDays === 0 ? "D-DAY" : `D-${first.diffDays}`;
        nearestDiv.innerHTML = `${first.name} <span class="main-dday-sub">${firstText}</span>`;

        // 조건 5. 세로로 작게 전체 디데이 리스트
        let listHtml = "";
        upcomingEvents.forEach(evt => {
          const text = evt.diffDays === 0 ? "D-DAY" : `D-${evt.diffDays}`;
          listHtml += `<div>${evt.name} (${evt.date}) : <strong>${text}</strong></div>`;
        });
        listDiv.innerHTML = listHtml;
      } else {
        nearestDiv.textContent = "남은 학사일정이 없습니다.";
        listDiv.innerHTML = "";
      }
    }

    // 기본 시간표 세팅

        2: { 1: ["한문", "과학2", "국어1", "체육", "기가", "음악"], 2: ["수학1", "국어1", "수학2", "과학1", "체육", "사회1", "영회"], 3: ["기가", "영어", "A_스포츠", "도덕", "수학1", "국어1"], 4: ["수학1", "음악", "사회1", "기가", "국어2", "과학1"], 5: ["미술", "체육", "국어2", "사회2", "영어", "도덕"] },
        3: { 1: ["음악", "체육", "수학1", "국어1", "과학2", "과학1"], 2: ["영어", "B_스포츠", "기가", "사회1", "수학1", "도덕", "국어1"], 3: ["영어", "사회1", "체육", "수학1", "국어2", "기가"], 4: ["과학1", "체육", "영회", "도덕", "음악", "국어2"], 5: ["기가", "미술", "수학1", "국어1", "한문", "사회2"] },

    function getCurrentGradeClass() {
      const g = document.getElementById("gradeSelect").value;
      const c = document.getElementById("classSelect").value;
      return { g, c };
    }

    function getStoredSchedule(g, c) {
      const key = `hagi_${g}_${c}_schedule`;
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : defaultSchedules[g][c];
    }

    window.onload = () => {
      updateClock();
      setInterval(updateClock, 1000);
      renderDday();
      fetchMealByDate(currentMealDate);
      selectDay(currentDay);
    };

    function changeClass() {
      selectDay(currentDay);
    }

    function changeMealDate(offsetDays) {
      currentMealDate.setDate(currentMealDate.getDate() + offsetDays);
      fetchMealByDate(currentMealDate);
    }

    function resetToTodayMeal() {
      currentMealDate = new Date();
      fetchMealByDate(currentMealDate);
    }

    async function fetchMealByDate(targetDate) {
      const mealDiv = document.getElementById("mealResult");
      const calDiv = document.getElementById("calorieResult");
      const dateBtn = document.getElementById("mealDateBtn");
      const resetBtn = document.getElementById("todayMealResetBtn");

      const year = targetDate.getFullYear();
      const month = String(targetDate.getMonth() + 1).padStart(2, '0');
      const day = String(targetDate.getDate()).padStart(2, '0');
      const YYYYMMDD = `${year}${month}${day}`;

      const realToday = new Date();
      const isToday = (
        targetDate.getFullYear() === realToday.getFullYear() &&
        targetDate.getMonth() === realToday.getMonth() &&
        targetDate.getDate() === realToday.getDate()
      );

      resetBtn.style.display = isToday ? "none" : "inline-block";

      const weekNames = ["일", "월", "화", "수", "목", "금", "토"];
      const weekName = weekNames[targetDate.getDay()];

      dateBtn.textContent = `${year}.${month}.${day}(${weekName})`;
      mealDiv.textContent = "급식을 불러오는 중...";
      calDiv.textContent = "";

      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_YMD=${YYYYMMDD}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.mealServiceDietInfo) {
          const row = data.mealServiceDietInfo[1].row[0];
          const rawDish = row.DDISH_NM;
          const calorie = row.CAL_INFO || "";
          
          mealDiv.textContent = rawDish.replace(/<br\/>/g, '\n').replace(/\([0-9.]+\)/g, '');
          calDiv.textContent = calorie ? `열량: ${calorie}` : "";
        } else {
          mealDiv.textContent = "해당 날짜의 급식 정보가 없습니다. (주말/휴교일)";
          calDiv.textContent = "";
        }
      } catch (err) {
        mealDiv.textContent = "급식 정보를 불러오지 못했습니다.";
        calDiv.textContent = "";
      }
    }

    async function openMealModal() {
      const modal = document.getElementById("mealModal");
      const grid = document.getElementById("monthlyMealGrid");
      const year = currentMealDate.getFullYear();
      const month = String(currentMealDate.getMonth() + 1).padStart(2, '0');
      const YYYYMM = `${year}${month}`;

      document.getElementById("modalTitle").textContent = `${year}년 ${Number(month)}월 전체 급식표`;
      modal.style.display = "flex";
      grid.innerHTML = "불러오는 중...";

      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_YM=${YYYYMM}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.mealServiceDietInfo) {
          const rows = data.mealServiceDietInfo[1].row;
          if (rows && rows.length > 0) {
            rows.sort((a, b) => a.MLSV_YMD.localeCompare(b.MLSV_YMD));
            grid.innerHTML = rows.map(r => {
              const dayNum = r.MLSV_YMD.substring(6, 8);
              const dish = r.DDISH_NM.replace(/<br\/>/g, '<br/>').replace(/\([0-9.]+\)/g, '');
              const cal = r.CAL_INFO ? `<div style="color:#8b5a2b; margin-top:2px;">${r.CAL_INFO}</div>` : '';
              return `
                <div class="day-meal-box">
                  <strong style="color:#8b5a2b;">${Number(dayNum)}일</strong>
                  <div>${dish}</div>
                  ${cal}
                </div>
              `;
            }).join('');
          } else {
            grid.textContent = "이번 달 급식 데이터가 없습니다.";
          }
        } else {
          grid.textContent = "이번 달 급식 데이터가 없습니다.";
        }
      } catch (err) {
        grid.textContent = "월간 급식 정보를 불러오지 못했습니다.";
      }
    }

    function closeMealModal() {
      document.getElementById("mealModal").style.display = "none";
    }

    function selectDay(dayNum) {
      currentDay = dayNum;
      document.getElementById("selectedDayText").textContent = `(${dayNames[dayNum]} - ${maxPeriods[dayNum]}교시)`;
      
      document.querySelectorAll(".day-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === dayNum);
      });

      const editArea = document.getElementById("editScheduleArea");
      if (editArea.style.display === "block") {
        renderScheduleForm();
      } else {
        renderScheduleView();
      }
    }

    function renderScheduleView() {
      const { g, c } = getCurrentGradeClass();
      const scheduleData = getStoredSchedule(g, c);
      const todayList = scheduleData[currentDay] || [];
      const viewDiv = document.getElementById("viewScheduleArea");
      const count = maxPeriods[currentDay];

      let html = "";
      for (let i = 0; i < count; i++) {
        const subject = todayList[i] || "";
        if (subject) {
          html += `
            <div class="schedule-item">
              <span class="period">${i + 1}교시</span>
              <span class="subject">${subject}</span>
            </div>
          `;
        }
      }
      viewDiv.innerHTML = html || "<div style='color:#888; text-align:center;'>등록된 시간표가 없습니다.</div>";
    }

    function toggleAdminMode() {
      const editArea = document.getElementById("editScheduleArea");
      const viewArea = document.getElementById("viewScheduleArea");

      if (editArea.style.display === "none") {
        editArea.style.display = "block";
        viewArea.style.display = "none";
        renderScheduleForm();
      } else {
        editArea.style.display = "none";
        viewArea.style.display = "block";
        renderScheduleView();
      }
    }

    function renderScheduleForm() {
      const { g, c } = getCurrentGradeClass();
      const scheduleData = getStoredSchedule(g, c);
      const todayList = scheduleData[currentDay] || [];
      const formDiv = document.getElementById("inputForm");
      const count = maxPeriods[currentDay];

      let html = "";
      for (let i = 0; i < count; i++) {
        html += `
          <div style="display:flex; align-items:center; margin-bottom:8px; gap:10px;">
            <label style="width:50px; font-weight:bold; color:#8b5a2b;">${i + 1}교시</label>
            <input type="text" id="period_${i}" value="${todayList[i] || ''}" placeholder="과목 입력" style="flex:1; padding:8px; border:1px solid #8b5a2b; border-radius:6px;">
          </div>
        `;
      }
      formDiv.innerHTML = html;
    }

    function saveSchedule() {
      const { g, c } = getCurrentGradeClass();
      const scheduleData = getStoredSchedule(g, c);
      const newList = [];
      const count = maxPeriods[currentDay];

      for (let i = 0; i < count; i++) {
        newList.push(document.getElementById(`period_${i}`).value.trim());
      }

      scheduleData[currentDay] = newList;
      localStorage.setItem(`hagi_${g}_${c}_schedule`, JSON.stringify(scheduleData));

      alert(`${g}학년 ${c}반 ${dayNames[currentDay]} 시간표가 저장되었습니다!`);
      document.getElementById("editScheduleArea").style.display = "none";
      document.getElementById("viewScheduleArea").style.display = "block";
      renderScheduleView();
    }

    function runLottery() {
      const total = parseInt(document.getElementById("lotteryCount").value);
      const resDiv = document.getElementById("lotteryResult");
      if (!total || total < 1) {
        alert("올바른 인원수를 입력하세요.");
        return;
      }
      resDiv.textContent = "추첨 중...";
      setTimeout(() => {
        const selected = Math.floor(Math.random() * total) + 1;
        resDiv.textContent = `당첨!!: ${selected}번!`;
      }, 300);
    }
  </script>
