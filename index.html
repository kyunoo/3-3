<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시간표</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f4f6f9; color: #333; position: relative; min-height: 100vh; box-sizing: border-box; }
    
    /* 헤더 및 실시간 시계 배치 */
    header { position: relative; text-align: center; margin-bottom: 25px; }
    .current-time { position: absolute; left: 0; top: 0; font-size: 20px; font-weight: 800; color: #1e293b; background: #ffffff; padding: 8px 16px; border-radius: 20px; border: 1.5px solid #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
    h1 { color: #1a365d; margin-bottom: 10px; margin-top: 10px; }
    
    .class-select-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .class-select-box select { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: bold; font-size: 15px; color: #1e293b; background: white; }

    /* 상단 2열 레이아웃 (시간표 왼쪽 / 급식 오른쪽) */
    .top-grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 768px) {
      .top-grid-container { grid-template-columns: 1fr; }
      .current-time { position: static; display: inline-block; margin-bottom: 10px; }
    }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .top-grid-container .card { margin-bottom: 0; }
    .card h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    
    .toggle-btn { font-size: 13px; color: #059669; cursor: pointer; font-weight: normal; }

    /* D-day 카드 스타일 (글씨 검정색으로 수정) */
    .dday-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 5px; }
    .dday-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px 10px; text-align: center; }
    .dday-title { font-size: 13px; color: #64748b; font-weight: bold; margin-bottom: 4px; }
    .dday-count { font-size: 20px; font-weight: 800; color: #1e293b; }
    .dday-count.today { color: #dc2626; }
    .dday-date { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    .date-click { font-size: 14px; color: #059669; cursor: pointer; text-decoration: underline; font-weight: normal; }
    .meal-content { line-height: 1.8; white-space: pre-line; font-size: 15px; }
    .calorie-info { font-size: 13px; color: #059669; font-weight: bold; margin-top: 8px; }

    /* 시간표 요소 */
    .schedule-item { display: flex; padding: 8px 10px; background-color: #f8fafc; border-radius: 6px; border-left: 4px solid #059669; margin-bottom: 8px; }
    .period { font-weight: bold; width: 60px; color: #059669; }
    .subject { font-weight: 500; }
    
    .edit-row { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; }
    .edit-row label { font-size: 14px; font-weight: bold; width: 50px; color: #059669; }
    .edit-input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    
    /* 기본 버튼 */
    .btn-primary { background: #059669; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; margin-top: 8px; }
    .btn-primary:hover { background: #047857; }
    
    .day-selector { display: flex; gap: 5px; margin-bottom: 15px; }
    .day-btn { flex: 1; padding: 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; }
    .day-btn.active { background: #059669; color: white; border-color: #059669; font-weight: bold; }

    /* 유틸리티 도구 양식 */
    .tool-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; }
    .tool-row input, .tool-row select { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .draw-result { font-size: 20px; font-weight: bold; color: #dc2626; text-align: center; margin-top: 10px; min-height: 30px; }

    /* 2048 게임 스타일 */
    #game2048Card { display: none; }
    .g2048-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #bbada0; padding: 10px; border-radius: 8px; max-width: 320px; margin: 15px auto; touch-action: none; }
    .g2048-cell { background: #ccc0b3; border-radius: 5px; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; color: #776e65; }
    .g2048-cell[data-val="2"] { background: #eee4da; color: #776e65; }
    .g2048-cell[data-val="4"] { background: #ede0c8; color: #776e65; }
    .g2048-cell[data-val="8"] { background: #f2b179; color: #f9f6f2; }
    .g2048-cell[data-val="16"] { background: #f59563; color: #f9f6f2; }
    .g2048-cell[data-val="32"] { background: #f67c5f; color: #f9f6f2; }
    .g2048-cell[data-val="64"] { background: #f65e3b; color: #f9f6f2; }
    .g2048-cell[data-val="128"] { background: #edcf72; color: #f9f6f2; font-size: 18px; }
    .g2048-cell[data-val="256"] { background: #edcc61; color: #f9f6f2; font-size: 18px; }
    .g2048-cell[data-val="512"] { background: #edc850; color: #f9f6f2; font-size: 18px; }
    .g2048-cell[data-val="1024"] { background: #edc53f; color: #f9f6f2; font-size: 16px; }
    .g2048-cell[data-val="2048"] { background: #edc22e; color: #f9f6f2; font-size: 16px; }

    /* 월간 급식 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; }
    .close-btn { font-size: 24px; cursor: pointer; border: none; background: none; color: #64748b; }
    .monthly-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .day-meal-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; font-size: 12px; }
    .day-meal-box strong { color: #059669; display: block; margin-bottom: 4px; border-bottom: 1px solid #cbd5e1; padding-bottom: 2px; }

    /* 페이지 맨 하단 푸터 (파란색 글씨로 수정) */
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
    .footer-credits { font-size: 12px; color: #64748b; line-height: 1.4; }
    .footer-credits a { color: #2563eb; text-decoration: none; }
    .fake-link { color: #2563eb; text-decoration: underline; cursor: pointer; }
    .admin-bottom-btn { padding: 8px 14px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 20px; color: #334155; font-size: 13px; font-weight: bold; cursor: pointer; }
    .admin-bottom-btn:hover { background: #f1f5f9; border-color: #2563eb; color: #2563eb; }
  </style>
</head>

    function getCurrentGradeClass() {
      const g = document.getElementById("gradeSelect").value;
      const c = document.getElementById("classSelect").value;
      return { g, c };
    }

    function getStoredSchedule(g, c) {
      const key = `hagi_${g}_${c}_schedule`;
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : defaultSchedules[g][c];
    }

    window.onload = () => {
      updateClock();
      setInterval(updateClock, 1000);
      renderDday();
      document.getElementById("mealDateBtn").textContent = `${YYYY}년 ${MM}월 ${DD}일 [월간 급식표]`;
      fetchTodayMeal();
      selectDay(currentDay);
    };

    function changeClass() {
      selectDay(currentDay);
    }

    // 1. 급식 및 칼로리 불러오기
    async function fetchTodayMeal() {
      const mealDiv = document.getElementById("mealResult");
      const calDiv = document.getElementById("calorieResult");
      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_YMD=${YYYY}${MM}${DD}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.mealServiceDietInfo) {
          const row = data.mealServiceDietInfo[1].row[0];
          const rawDish = row.DDISH_NM;
          const calorie = row.CAL_INFO || "";
          
          mealDiv.textContent = rawDish.replace(/<br\/>/g, '\n').replace(/\([0-9.]+\)/g, '');
          calDiv.textContent = calorie ? `열량: ${calorie}` : "";
        } else {
          mealDiv.textContent = "오늘의 급식 정보가 없습니다. (주말/휴교일)";
          calDiv.textContent = "";
        }
      } catch (err) {
        mealDiv.textContent = "급식 불러오기 실패";
        calDiv.textContent = "";
      }
    }

    // 2. 월간 급식 모달
    async function openMealModal() {
      const modal = document.getElementById("mealModal");
      const grid = document.getElementById("monthlyMealGrid");
      document.getElementById("modalTitle").textContent = `${YYYY}년 ${Number(MM)}월 전체 급식표`;
      modal.style.display = "flex";
      grid.innerHTML = "불러오는 중...";

      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_YM=${YYYYMM}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.mealServiceDietInfo) {
          const rows = data.mealServiceDietInfo[1].row.filter(r => r.MLSV_YMD.startsWith(YYYYMM));
          if (rows.length > 0) {
            grid.innerHTML = rows.map(r => {
              const dayNum = r.MLSV_YMD.substring(6, 8);
              const dish = r.DDISH_NM.replace(/<br\/>/g, '<br/>').replace(/\([0-9.]+\)/g, '');
              const cal = r.CAL_INFO ? `<div style="color:#059669; margin-top:2px;">${r.CAL_INFO}</div>` : '';
              return `
                <div class="day-meal-box">
                  <strong>${Number(dayNum)}일</strong>
                  <div>${dish}</div>
                  ${cal}
                </div>
              `;
            }).join('');
          } else {
            grid.textContent = "이번 달 급식 데이터가 없습니다.";
          }
        }
      } catch (err) {
        grid.textContent = "월간 급식 정보를 불러오지 못했습니다.";
      }
    }

    function closeMealModal() {
      document.getElementById("mealModal").style.display = "none";
    }

    // 3. 시간표 조회 및 수정
    function selectDay(dayNum) {
      currentDay = dayNum;
      const dayNames = ["", "월요일", "화요일", "수요일", "목요일", "금요일"];
      document.getElementById("selectedDayText").textContent = `(${dayNames[dayNum]} - ${maxPeriods[dayNum]}교시)`;
      
      document.querySelectorAll(".day-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === dayNum);
      });

      const editArea = document.getElementById("editScheduleArea");
      if (editArea.style.display === "block") {
        renderScheduleForm();
      } else {
        renderScheduleView();
      }
    }

    function renderScheduleView() {
      const { g, c } = getCurrentGradeClass();
      const scheduleData = getStoredSchedule(g, c);
      const todayList = scheduleData[currentDay] || [];
      const viewDiv = document.getElementById("viewScheduleArea");
      const count = maxPeriods[currentDay];

      let html = "";
      for (let i = 0; i < count; i++) {
        const subject = todayList[i] || "";
        if (subject) {
          html += `
            <div class="schedule-item">
              <span class="period">${i + 1}교시</span>
              <span class="subject">${subject}</span>
            </div>
          `;
        }
      }
      viewDiv.innerHTML = html || "<div style='color:#888; text-align:center;'>등록된 시간표가 없습니다.</div>";
    }

    function toggleAdminMode() {
      const editArea = document.getElementById("editScheduleArea");
      const viewArea = document.getElementById("viewScheduleArea");

      if (editArea.style.display === "none") {
        const pw = prompt("관리자 비밀번호를 입력하세요:");
        if (pw === ADMIN_PW) {
          editArea.style.display = "block";
          viewArea.style.display = "none";
          renderScheduleForm();
        } else if (pw !== null) {
          alert("비밀번호가 틀렸습니다.");
        }
      } else {
        editArea.style.display = "none";
        viewArea.style.display = "block";
        renderScheduleView();
      }
    }

    function renderScheduleForm() {
      const { g, c } = getCurrentGradeClass();
      const scheduleData = getStoredSchedule(g, c);
      const todayList = scheduleData[currentDay] || [];
      const formDiv = document.getElementById("inputForm");
      const count = maxPeriods[currentDay];

      let html = "";
      for (let i = 0; i < count; i++) {
        html += `
          <div class="edit-row">
            <label>${i + 1}교시</label>
            <input type="text" class="edit-input" id="period_${i}" value="${todayList[i] || ''}" placeholder="과목 입력">
          </div>
        `;
      }
      formDiv.innerHTML = html;
    }

    function saveSchedule() {
      const { g, c } = getCurrentGradeClass();
      const scheduleData = getStoredSchedule(g, c);
      const newList = [];
      const count = maxPeriods[currentDay];

      for (let i = 0; i < count; i++) {
        newList.push(document.getElementById(`period_${i}`).value.trim());
      }

      scheduleData[currentDay] = newList;
      localStorage.setItem(`hagi_${g}_${c}_schedule`, JSON.stringify(scheduleData));

      alert(`${g}학년 ${c}반 ${currentDay}요일 시간표가 저장되었습니다!`);
      document.getElementById("editScheduleArea").style.display = "none";
      document.getElementById("viewScheduleArea").style.display = "block";
      renderScheduleView();
    }

    // 4. 번호 제비뽑기 기능
    function runLottery() {
      const total = parseInt(document.getElementById("lotteryCount").value);
      const resDiv = document.getElementById("lotteryResult");
      if (!total || total < 1) {
        alert("올바른 인원수를 입력하세요.");
        return;
      }
      resDiv.textContent = "추첨 중...";
      setTimeout(() => {
        const selected = Math.floor(Math.random() * total) + 1;
        resDiv.textContent = `당첨!!: ${selected}번!`;
      }, 300);
    }

    // 5. 이스터에그 2048 게임 토글
    let board2048 = Array(4).fill().map(() => Array(4).fill(0));
    let score2048 = 0;

    function toggle2048Game() {
      const card = document.getElementById("game2048Card");
      if (card.style.display === "none" || card.style.display === "") {
        card.style.display = "block";
        init2048();
        card.scrollIntoView({ behavior: 'smooth' });
      } else {
        card.style.display = "none";
      }
    }

    function init2048() {
      board2048 = Array(4).fill().map(() => Array(4).fill(0));
      score2048 = 0;
      addRandomTile2048();
      addRandomTile2048();
      updateBoard2048();
    }

    function addRandomTile2048() {
      let emptyCells = [];
      for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
          if(board2048[r][c] === 0) emptyCells.push({r, c});
        }
      }
      if(emptyCells.length > 0) {
        let rand = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        board2048[rand.r][rand.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function updateBoard2048() {
      const container = document.getElementById("g2048Board");
      container.innerHTML = "";
      document.getElementById("gameScore").textContent = score2048;

      for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
          let val = board2048[r][c];
          let cell = document.createElement("div");
          cell.className = "g2048-cell";
          if(val > 0) {
            cell.textContent = val;
            cell.setAttribute("data-val", val);
          }
          container.appendChild(cell);
        }
      }
    }

    function slide2048(row) {
      let arr = row.filter(val => val);
      for(let i=0; i<arr.length-1; i++){
        if(arr[i] === arr[i+1]){
          arr[i] *= 2;
          score2048 += arr[i];
          arr[i+1] = 0;
        }
      }
      arr = arr.filter(val => val);
      while(arr.length < 4) arr.push(0);
      return arr;
    }

    function move2048(dir) {
      let moved = false;
      let prevBoard = JSON.stringify(board2048);

      if(dir === 'left') {
        for(let r=0; r<4; r++) board2048[r] = slide2048(board2048[r]);
      } else if(dir === 'right') {
        for(let r=0; r<4; r++) board2048[r] = slide2048(board2048[r].reverse()).reverse();
      } else if(dir === 'up') {
        for(let c=0; c<4; c++){
          let col = [board2048[0][c], board2048[1][c], board2048[2][c], board2048[3][c]];
          col = slide2048(col);
          for(let r=0; r<4; r++) board2048[r][c] = col[r];
        }
      } else if(dir === 'down') {
        for(let c=0; c<4; c++){
          let col = [board2048[0][c], board2048[1][c], board2048[2][c], board2048[3][c]];
          col = slide2048(col.reverse()).reverse();
          for(let r=0; r<4; r++) board2048[r][c] = col[r];
        }
      }

      if(prevBoard !== JSON.stringify(board2048)) {
        addRandomTile2048();
        updateBoard2048();
      }
    }

    // 키보드 조작 이벤트
    window.addEventListener("keydown", (e) => {
      if(document.getElementById("game2048Card").style.display === "block") {
        if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
          e.preventDefault();
          if(e.key === "ArrowUp") move2048('up');
          if(e.key === "ArrowDown") move2048('down');
          if(e.key === "ArrowLeft") move2048('left');
          if(e.key === "ArrowRight") move2048('right');
        }
      }
    });

    // 터치 모바일 스와이프 조작 이벤트
    let touchStartX = 0, touchStartY = 0;
    const boardElem = document.getElementById("g2048Board");

    boardElem.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, {passive: true});

    boardElem.addEventListener("touchend", (e) => {
      if(!touchStartX || !touchStartY) return;
      let dx = e.changedTouches[0].clientX - touchStartX;
      let dy = e.changedTouches[0].clientY - touchStartY;

      if(Math.abs(dx) > Math.abs(dy)) {
        if(dx > 30) move2048('right');
        else if(dx < -30) move2048('left');
      } else {
        if(dy > 30) move2048('down');
        else if(dy < -30) move2048('up');
      }
    }, {passive: true});
  </script>
